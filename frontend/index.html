<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="google-site-verification" content="_D8kWKKjWX9kVbOg7WD19Qw9ifCGYer9F1cNlOY3c2I" />
    <meta name="theme-color" content="#0a0a0c" />

    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://portfolio-api-rose.vercel.app" crossorigin />
    <!-- Fonts load without blocking the first paint; the page shows in the system font until they arrive. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700&family=IBM+Plex+Mono:wght@400;500&display=swap" />
    </noscript>

    <script>document.documentElement.classList.add("js")</script>
    <style>
      body { margin: 0; background: #0a0a0c; color: #f2f2f5; font-family: "Bricolage Grotesque", system-ui, sans-serif; line-height: 1.6; }
      .crawl { max-width: 960px; margin: 0 auto; padding: 32px 20px; }
      /* With JavaScript on, the crawler copy shows only the name, sized like the
         hero's, until the app replaces it: a calm first paint, no text flash. */
      .js .crawl { min-height: 100vh; padding: 0 clamp(16px, 4vw, 40px); display: grid; align-content: center; max-width: 1180px; }
      .js .crawl > :not(h1) { display: none; }
      .js .crawl h1 { margin: 0; font-size: clamp(2.9rem, 6.6vw, 5.4rem); line-height: 1.02; letter-spacing: -0.02em; font-weight: 700; }
      @media (max-width: 820px) { .js .crawl h1 { font-size: 2.4rem; } }
    </style>

    <!--seo-->
  </head>
  <body>
    <div id="root"><!--crawl--></div>
    <noscript>
      <p style="padding:16px">This site works best with JavaScript on, but the main content above is readable without it.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
