<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0b10"/>
      <stop offset="100%" stop-color="#111116"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <rect width="960" height="600" fill="url(#bg)"/>

  <!-- Header -->
  <text x="48" y="70" font-family="Segoe UI, sans-serif" font-size="26" font-weight="700" fill="#ffffff">Email Gateway</text>
  <text x="48" y="98" font-family="Segoe UI, sans-serif" font-size="14" fill="#9ca3af">Shared multi-tenant email infrastructure — 4 projects, one gateway</text>
  <circle cx="900" cy="60" r="6" fill="#22c55e"/>
  <text x="915" y="65" font-family="Segoe UI, sans-serif" font-size="12" fill="#22c55e" text-anchor="end">live</text>

  <!-- Stat tiles -->
  <g font-family="Segoe UI, sans-serif">
    <rect x="48" y="130" width="200" height="110" rx="14" fill="#17171d" stroke="#2a2a33"/>
    <text x="70" y="165" font-size="12" letter-spacing="1" fill="#7c8494">RESEND, 24H</text>
    <text x="70" y="205" font-size="30" font-weight="800" fill="#ffffff">38 / 95</text>
    <text x="70" y="225" font-size="11" fill="#7c8494">before Gmail fallback</text>

    <rect x="268" y="130" width="200" height="110" rx="14" fill="#17171d" stroke="#2a2a33"/>
    <text x="290" y="165" font-size="12" letter-spacing="1" fill="#7c8494">DELIVERED, 24H</text>
    <text x="290" y="205" font-size="30" font-weight="800" fill="#ffffff">312</text>
    <text x="290" y="225" font-size="11" fill="#7c8494">across every project</text>

    <rect x="488" y="130" width="200" height="110" rx="14" fill="#17171d" stroke="#2a2a33"/>
    <text x="510" y="165" font-size="12" letter-spacing="1" fill="#7c8494">AWAITING RETRY</text>
    <text x="510" y="205" font-size="30" font-weight="800" fill="#ffffff">0</text>
    <text x="510" y="225" font-size="11" fill="#7c8494">auto inline retry ×2</text>

    <rect x="708" y="130" width="204" height="110" rx="14" fill="#17171d" stroke="#2a2a33"/>
    <text x="730" y="165" font-size="12" letter-spacing="1" fill="#7c8494">TENANTS</text>
    <text x="730" y="205" font-size="30" font-weight="800" fill="#ffffff">4</text>
    <text x="730" y="225" font-size="11" fill="#7c8494">shared reputation</text>
  </g>

  <!-- By-project bars -->
  <g font-family="Segoe UI, sans-serif">
    <text x="48" y="280" font-size="12" letter-spacing="1" fill="#7c8494">BY PROJECT, LAST 24H</text>

    <text x="48" y="308" font-size="13" fill="#d1d5db">medqize</text>
    <rect x="150" y="296" width="620" height="16" rx="8" fill="#1f1f27"/>
    <rect x="150" y="296" width="480" height="16" rx="8" fill="url(#accent)"/>
    <text x="800" y="308" font-size="12" fill="#9ca3af" text-anchor="end">210</text>

    <text x="48" y="338" font-size="13" fill="#d1d5db">hr</text>
    <rect x="150" y="326" width="620" height="16" rx="8" fill="#1f1f27"/>
    <rect x="150" y="326" width="220" height="16" rx="8" fill="url(#accent)"/>
    <text x="800" y="338" font-size="12" fill="#9ca3af" text-anchor="end">96</text>

    <text x="48" y="368" font-size="13" fill="#d1d5db">portfolio</text>
    <rect x="150" y="356" width="620" height="16" rx="8" fill="#1f1f27"/>
    <rect x="150" y="356" width="60" height="16" rx="8" fill="url(#accent)"/>
    <text x="800" y="368" font-size="12" fill="#9ca3af" text-anchor="end">6</text>

    <text x="48" y="398" font-size="13" fill="#d1d5db">game</text>
    <rect x="150" y="386" width="620" height="16" rx="8" fill="#1f1f27"/>
    <rect x="150" y="386" width="0" height="16" rx="8" fill="url(#accent)"/>
    <text x="800" y="398" font-size="12" fill="#9ca3af" text-anchor="end">0</text>
  </g>

  <!-- Routing diagram -->
  <g font-family="Segoe UI, sans-serif">
    <text x="48" y="450" font-size="12" letter-spacing="1" fill="#7c8494">ROUTING</text>

    <rect x="48" y="465" width="150" height="54" rx="12" fill="#17171d" stroke="#2a2a33"/>
    <text x="123" y="497" font-size="13" fill="#e5e7eb" text-anchor="middle">4 tenant apps</text>

    <path d="M198 492 h60" stroke="#4b5563" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

    <rect x="258" y="465" width="150" height="54" rx="12" fill="#17171d" stroke="#3B82F6"/>
    <text x="333" y="491" font-size="13" fill="#ffffff" text-anchor="middle">Resend</text>
    <text x="333" y="507" font-size="10" fill="#9ca3af" text-anchor="middle">primary · verified domain</text>

    <path d="M258 492 h-30 v40 h30" stroke="#4b5563" stroke-width="2" fill="none"/>
    <path d="M408 492 h60" stroke="#4b5563" stroke-width="2" fill="none"/>

    <rect x="468" y="465" width="150" height="54" rx="12" fill="#17171d" stroke="#8B5CF6"/>
    <text x="543" y="491" font-size="13" fill="#ffffff" text-anchor="middle">Gmail SMTP</text>
    <text x="543" y="507" font-size="10" fill="#9ca3af" text-anchor="middle">fallback · budget exhausted</text>

    <rect x="678" y="465" width="234" height="54" rx="12" fill="#17171d" stroke="#2a2a33"/>
    <text x="795" y="491" font-size="13" fill="#e5e7eb" text-anchor="middle">Bounce/complaint webhook</text>
    <text x="795" y="507" font-size="10" fill="#9ca3af" text-anchor="middle">Svix-signed · shared suppression list</text>

    <path d="M618 492 h60" stroke="#4b5563" stroke-width="2" fill="none"/>
  </g>

  <text x="48" y="565" font-family="Segoe UI, sans-serif" font-size="11" fill="#5b6272">Illustrative mockup — live dashboard omitted to avoid exposing real recipient data</text>
</svg>
